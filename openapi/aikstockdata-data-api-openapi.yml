      operationId: getDataPublicDartReceiptTimesMinJson
      x-operation-id-source: derived
  /data/public/disclosures.csv:
    get:
      summary: 공시 목록(CSV)
      description: disclosures.json 과 같은 내용의 CSV 판.
      responses:
        '200':
          description: 성공
          content:
            text/csv:
              schema:
                type: string
                description: CSV 텍스트(첫 줄이 머리글). UTF-8 · 쉼표 구분.
        '404':
          description: 없는 종목코드/날짜
