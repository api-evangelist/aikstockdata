      operationId: getDataPublicDisclosuresCsv
      x-operation-id-source: derived
  /data/public/disclosures_intraday.json:
    get:
      summary: 장중 공시 목록(15:00 수집)
      description: 그날 00:00~15:00 접수 공시. ★접수 시각(HH:MM)이 있어 장중/장후를 구분할 수 있습니다. 18:10 본 발행에서 하루치 전체로 갱신됩니다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
