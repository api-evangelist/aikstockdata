openapi: 3.2.0
info:
  title: 한국주식데이터 공개 데이터 Data API
  version: '20260910'
  description: 'KOSPI·KOSDAQ·KONEX 확정 종가(T+1)·DART 공시·실측 분기 실적을 매 거래일 18:10 KST 에 정적 JSON 으로 발행합니다. 인증·API 키 불필요 · 요청 쿼터 없음, CORS 개방. ★시세는 실시간이 아닌 전 영업일 확정 종가입니다. null 은 ''미제공''이며 0 과 다릅니다. 큰 파일은 AI fetch 도구에서 잘릴 수 있으니 150KB 미만 소형판을 우선 쓰세요(안내: index.json 의 fetch_guide). 정보 제공 목적이며 투자 권유가 아닙니다.'
  contact:
    name: 한국주식데이터
    url: https://aikstockdata.com/about
  license:
    name: 공공데이터(DART·금융위) 가공물 — 출처 표기 후 자유 이용(영리 포함)
    url: https://aikstockdata.com/terms
servers:
- url: https://aikstockdata.com
tags:
- name: Data
paths:
  /data/public/dart_receipt_times.json:
    get:
      summary: 공시 접수 시각 캐시
      description: 접수번호별 HH:MM. OpenAPI 가 날짜만 주므로 별도 수집.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
        '404':
          description: 없는 종목코드/날짜
      tags:
      - Data
      operationId: getDataPublicDartReceiptTimesJson
      x-operation-id-source: derived
  /data/public/dart_receipt_times_min.json:
    get:
      summary: 접수 시각 소형판
      description: 위 파일의 경량본.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
        '404':
