      operationId: getDataPublicDisclosuresIntradayMinJson
      x-operation-id-source: derived
  /data/public/earnings_calendar.json:
    get:
      summary: 실적 발표 예정·확정 캘린더
      description: 정기보고서·잠정실적의 접수 예정일과 확정일.
