  /data/public/press_owl_filings.csv:
    get:
      summary: 기자용 — 올빼미 공시 통계(CSV)
      description: 날짜별 DART 접수 건수를 장전·장중·장후·시각미확보로 나눈 표와 장후 비율(%). 범위는 dart_receipt_times.json 과 같다(전건 아님).
      responses:
